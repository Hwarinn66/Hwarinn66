<svg xmlns="http://www.w3.org/2000/svg" width="800" height="24" viewBox="0 0 800 24" role="img" aria-label="Animated divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#0891b2"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="0.8" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="0" y="10" width="800" height="4" rx="2"/></clipPath>
  </defs>
  <style>
    .shine { animation: sweep 3.2s ease-in-out infinite; }
    .dot   { animation: travel 3.2s ease-in-out infinite; }
    .spark { animation: pulse 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .s2 { animation-delay: .4s; } .s3 { animation-delay: .8s; }
    @keyframes sweep  { from { transform: translateX(-200px); } to { transform: translateX(800px); } }
    @keyframes travel { from { transform: translateX(0); }      to { transform: translateX(800px); } }
    @keyframes pulse  { 0%,100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.2); } }
  </style>
  <rect x="0" y="11" width="800" height="2" rx="1" fill="url(#line)"/>
  <g clip-path="url(#clip)">
    <rect class="shine" x="0" y="10" width="200" height="4" fill="url(#shine)"/>
  </g>
  <circle class="dot" cx="0" cy="12" r="3.5" fill="#e0f2fe" filter="url(#glow)"/>
  <g fill="#38bdf8">
    <circle class="spark" cx="384" cy="12" r="2.5"/>
    <circle class="spark s2" cx="400" cy="12" r="3.5" fill="#818cf8"/>
    <circle class="spark s3" cx="416" cy="12" r="2.5"/>
  </g>
</svg>
