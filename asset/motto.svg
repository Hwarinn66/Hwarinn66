<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150" role="img" aria-label="Learn by building, improve by iterating">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="text" gradientUnits="userSpaceOnUse" x1="-800" y1="0" x2="0" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.25" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="0.75" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#38bdf8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="800 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="2" y="2" width="796" height="146" rx="18"/></clipPath>
  </defs>
  <style>
    .orb1 { animation: drift1 9s ease-in-out infinite; }
    .orb2 { animation: drift2 11s ease-in-out infinite; }
    .star { animation: twinkle 2.4s ease-in-out infinite; }
    .d1 { animation-delay: .3s; } .d2 { animation-delay: .9s; } .d3 { animation-delay: 1.5s; }
    .d4 { animation-delay: 2s; }  .d5 { animation-delay: 1.2s; }
    .sub { animation: fade 4s ease-in-out infinite; }
    @keyframes drift1  { 0%,100% { transform: translate(0,0); } 50% { transform: translate(140px,20px); } }
    @keyframes drift2  { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-160px,-15px); } }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    @keyframes fade    { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="800" height="150" fill="url(#bg)"/>
    <circle class="orb1" cx="150" cy="40" r="120" fill="url(#orb)"/>
    <circle class="orb2" cx="660" cy="120" r="130" fill="url(#orb2)"/>
    <g fill="#e0f2fe">
      <circle class="star"    cx="60"  cy="30"  r="1.6"/>
      <circle class="star d1" cx="210" cy="118" r="1.3"/>
      <circle class="star d2" cx="330" cy="22"  r="1.5"/>
      <circle class="star d3" cx="520" cy="128" r="1.4"/>
      <circle class="star d4" cx="640" cy="28"  r="1.7"/>
      <circle class="star d5" cx="748" cy="96"  r="1.3"/>
      <circle class="star d2" cx="110" cy="96"  r="1.2"/>
      <circle class="star d4" cx="460" cy="40"  r="1.1"/>
    </g>
  </g>
  <rect x="2" y="2" width="796" height="146" rx="18" fill="none" stroke="url(#border)" stroke-width="2" stroke-opacity="0.8"/>

  <text x="400" y="74" text-anchor="middle" fill="url(#text)"
        font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="0.5">Learn by building, improve by iterating.</text>
  <text class="sub" x="400" y="108" text-anchor="middle" fill="#94a3b8"
        font-family="'JetBrains Mono', Consolas, Menlo, monospace"
        font-size="14" letter-spacing="3">— HWARIN —</text>
</svg>
